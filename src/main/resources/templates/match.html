<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Match</title>
</head>

<body>

  <h1>対戦画面</h1>

  <h2>
    <span th:text="${loginUser}"></span>
    vs
    <span th:text="${opponent.name}"></span>
  </h2>

  <!-- じゃんけんの手を選択するリンク -->
  <div th:if="${userHand == null}">
    <h3>あなたの手を選択してください</h3>

    <a th:href="@{/wait(id=${opponent.id},hand='グー')}">グー</a>
    <a th:href="@{/wait(id=${opponent.id},hand='チョキ')}">チョキ</a>
    <a th:href="@{/wait(id=${opponent.id},hand='パー')}">パー</a>
  </div>

  <!-- 試合結果 -->
  <div th:if="${userHand != null}">
    <h3>試合結果</h3>

    <p>
      <span th:text="${loginUser}"></span>の手：
      <span th:text="${userHand}"></span>
    </p>

    <p>
      <span th:text="${opponent.name}"></span>の手：
      <span th:text="${cpuHand}"></span>
    </p>

    <h3 th:text="${result}"></h3>
  </div>

  <a href="/janken">もどる</a>

</body>

</html>
