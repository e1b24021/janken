<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>じゃんけん</title>
</head>

<body>
  <h2>エントリー</h2>
  <ul>
    <li th:each="user : ${users}" th:text="${user.name}">
    </li>
  </ul>
  <p th:if="${username != null}" th:text="'Hi ' + ${username}"> </p>
  <h2>あなたの手を選んでください</h2>

  <ul>
    <li>
      <a th:href="@{/janken(hand='グー', username=${username})}">
        グー
      </a>
    </li>
    <li>
      <a th:href="@{/janken(hand='チョキ', username=${username})}">
        チョキ
      </a>
    </li>
    <li>
      <a th:href="@{/janken(hand='パー', username=${username})}">
        パー
      </a>
    </li>
  </ul>

  <div th:if="${janken != null}">
    <h2>対戦結果</h2>

    <p>
      あなたの手：
      <span th:text="${janken.playerHand}"></span>
    </p>

    <p>
      相手の手：
      <span th:text="${janken.cpuHand}"></span>
    </p>

    <p>
      結果：
      <span th:text="${janken.result}"></span>
    </p>
  </div>

  <table border="1">
    <thead>
      <tr>
        <th>試合ID</th>
        <th>ユーザー1</th>
        <th>ユーザー2</th>
        <th>ユーザー1の手</th>
        <th>ユーザー2の手</th>
      </tr>
    </thead>

    <tbody>
      <tr th:each="match : ${matches}">
        <td th:text="${match.id}"></td>
        <td th:text="${match.user1}"></td>
        <td th:text="${match.user2}"></td>
        <td th:text="${match.user1Hand}"></td>
        <td th:text="${match.user2Hand}"></td>
      </tr>
    </tbody>
  </table>

  <form th:action="@{/logout}" method="post" onsubmit="return confirm('Are you sure you want to log out?');">
    <button type="submit">ログアウト</button>
  </form>

</body>

</html>
