<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Janken GAME!</title>
</head>

<body>
  <h1>Janken GAME!</h1>

  <p th:if="${username != null}" th:text="'Hi ' + ${username}"></p>

  <p>
    <a href="/jankengame?hand=Gu">ぐー</a>
    <a href="/jankengame?hand=Ch">ちょき</a>
    <a href="/jankengame?hand=Pa">ぱー</a>

  <div th:if="${janken != null}">

    <p th:text="'相手の手 ' + ${janken.cpuHand}"></p>
    <p th:text="'結果 ' + ${janken.result}"></p>
  </div>
</body>

</html>
